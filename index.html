<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <script src="https://www.google.com/recaptcha/api.js"></script>

    <script>
        function timestamp() {
            var response = document.getElementById("g-recaptcha-response");

            if (response == null || response.value.trim() == "") {
                var elems = JSON.parse(
                    document.getElementsByName("captcha_settings")[0].value,
                );

                elems["ts"] = JSON.stringify(new Date().getTime());

                document.getElementsByName("captcha_settings")[0].value =
                    JSON.stringify(elems);
            }
        }

        setInterval(timestamp, 500);
    </script>
</head>

<body>
    <form action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00D5h000009PQya"
        method="POST">
        <!-- Salesforce Configuration -->
        <input type="hidden" name="captcha_settings"
            value='{"keyname":"Novabiz_Google_Recaptcha","fallback":"true","orgId":"00D5h000009PQya","ts":""}' />

        <input type="hidden" name="oid" value="00D5h000009PQya" />

        <input type="hidden" name="retURL" value="https://novabiz.co.in/?submitted=1#contact" />

        <!-- First Name - Required -->
        <label for="first_name">First Name *</label>
        <input id="first_name" maxlength="40" name="first_name" size="20" type="text" required />
        <br /><br />

        <!-- Last Name - Required -->
        <label for="last_name">Last Name *</label>
        <input id="last_name" maxlength="80" name="last_name" size="20" type="text" required />
        <br /><br />

        <!-- Email - Required -->
        <label for="email">Email *</label>
        <input id="email" maxlength="80" name="email" size="20" type="email" required />
        <br /><br />

        <!-- Company - Required -->
        <label for="company">Company *</label>
        <input id="company" maxlength="40" name="company" size="20" type="text" required />
        <br /><br />

        <!-- Phone - Required -->
        <label for="phone">Phone *</label>
        <input id="phone" maxlength="40" name="phone" size="20" type="tel" required />
        <br /><br />

        <!-- Service Interested In - Optional -->
        <label for="00Nfu00000JocIX"> Service Interested In </label>

        <select id="00Nfu00000JocIX" name="00Nfu00000JocIX" title="Service Interested In">
            <option value="">-- Select Service --</option>

            <option value="Support Services">Support Services</option>

            <option value="Project Implementations">Project Implementations</option>

            <option value="Customizations & Enhancements">
                Customizations & Enhancements
            </option>

            <option value="System Integrations">System Integrations</option>

            <option value="Salesforce Staffing">Salesforce Staffing</option>

            <option value="Technical Consultation">Technical Consultation</option>

            <option value="Training & Change Management">
                Training & Change Management
            </option>
        </select>

        <br /><br />

        <!-- Description - Optional -->
        <label for="description">Description</label>

        <textarea id="description" name="description" rows="5" cols="40"></textarea>

        <br /><br />

        <!-- Lead Source -->
        <input type="hidden" id="lead_source" name="lead_source" value="Web" />

        <!-- Google reCAPTCHA -->
        <div class="g-recaptcha" data-sitekey="6LeuudMtAAAAAAuPn8A3AZgfhD8NHwhYlf3MAVbb"></div>

        <br />

        <!-- Submit -->
        <input type="submit" name="submit" value="Submit" />
    </form>
</body>

</html>
